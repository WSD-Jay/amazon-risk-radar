name: 每日风险雷达

on:
  schedule:
    - cron: '15 1 * * *' # 新加坡时间 09:15
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: amazon-risk-radar-pages
  cancel-in-progress: false

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: 检查增量筛选
        run: node scripts/update.mjs --self-test
      - name: 生成今日日报
        run: node scripts/update.mjs
      - name: 验证新鲜度
        run: node scripts/check-fresh.mjs site/index.html
      - name: 保存日报归档
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data site
          git diff --cached --quiet || git commit -m "日报：$(date -u +%F)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: 发布 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
